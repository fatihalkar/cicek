<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çiçek Buketi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Düzen: tam ekran tuval (çiçekler) + ortada hafif eğik duran satırlı mektup kağıdı.
   Tek bir görsel dünya: koyu erik bahçe gecesi, sıcak kağıt, el yazısı. */
:root {
  color-scheme: dark;
  --bg: #1a0e22;
  --bg-glow: #3b1a48;
  --paper: #fdf6ee;
  --ink: #3a2342;
  --rose: #c93a6f;
  --rule: #ecd9dd;
  --stem: #3a8a57;
  --stem-dark: #1f5236;
  --wrap: #f6dcd4;
  --wrap-dark: #e5b2ae;
  --ribbon: #c0335f;
  --hand: 'Caveat', 'Segoe Script', 'Bradley Hand', 'Comic Sans MS', cursive;
}
html { height: 100%; box-sizing: border-box; }
body {
  margin: 0;
  box-sizing: border-box;
  height: 100%;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--bg);
  background-image: radial-gradient(120% 90% at 50% 38%, var(--bg-glow), var(--bg) 70%);
  color: var(--ink);
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  place-items: center;
  -webkit-tap-highlight-color: transparent;
}
#garden {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; pointer-events: none; z-index: 0;
}
.veil {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  opacity: 0; transition: opacity 1.4s ease;
  background: radial-gradient(60% 55% at 50% 50%, rgba(22, 6, 28, .6), rgba(22, 6, 28, 0) 100%);
}
.veil.on { opacity: 1; }

.paper {
  position: relative; z-index: 2;
  box-sizing: border-box;
  width: min(34rem, 100%);
  height: min(31rem, 100%);
  display: flex; flex-direction: column;
  padding-top: 1.1rem;
  background: var(--paper);
  border-radius: 3px 3px 7px 7px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 2px 5px rgba(20, 4, 28, .3), 0 28px 64px -14px rgba(20, 4, 28, .7);
  opacity: 0; visibility: hidden;
  transform: translateY(70vh) rotate(9deg) scale(.7);
  transition: transform 1.1s cubic-bezier(.2, 1.15, .3, 1), opacity .5s ease, visibility 0s linear 1.1s;
}
.paper.in {
  opacity: 1; visibility: visible;
  transform: rotate(-1.4deg);
  transition: transform 1.1s cubic-bezier(.2, 1.15, .3, 1), opacity .5s ease, visibility 0s;
}
.paper.instant { transition: none; }
.paper::before {
  content: ""; position: absolute; top: -.85rem; left: 50%;
  width: 6.2rem; height: 1.8rem;
  transform: translateX(-50%) rotate(2.2deg);
  background: rgba(236, 160, 184, .75);
  box-shadow: 0 1px 3px rgba(20, 4, 28, .25);
}
.paper::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 3rem; width: 1.5px;
  background: rgba(201, 58, 111, .5); pointer-events: none;
}
.letter {
  flex: 1; min-height: 0;
  box-sizing: border-box;
  overflow-y: auto; overscroll-behavior: contain;
  padding: .35em 1.1rem .8em 3.6rem;
  font-family: var(--hand); font-weight: 500;
  font-size: clamp(1.5rem, 1.15rem + 1.5vw, 2rem);
  line-height: 1.55;
  color: var(--ink);
  white-space: pre-wrap; overflow-wrap: anywhere;
  outline: none;
  background-image: linear-gradient(to bottom, transparent calc(1.55em - 1px), var(--rule) calc(1.55em - 1px));
  background-size: 100% 1.55em;
  background-position: 0 .35em;
  background-attachment: local;
}
.letter:focus-visible { outline: 2px dashed var(--rose); outline-offset: -.5rem; }
.letter:not(.typing):empty::before { content: attr(data-ph); color: rgba(58, 35, 66, .38); }
.letter.typing::after {
  content: ""; display: inline-block; width: .08em; height: 1em;
  margin-left: .05em; vertical-align: -.12em; background: var(--rose);
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.replay {
  position: fixed; z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: max(12px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; padding: 0;
  display: grid; place-items: center;
  color: #fff;
  background: rgba(26, 14, 34, .55);
  border: 1px solid rgba(255, 255, 255, .24);
  border-radius: 50%;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  cursor: pointer;
  animation: fadeIn .8s .6s both;
}
.replay:hover { background: rgba(70, 30, 84, .7); }
.replay:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .paper, .paper.in, .veil { transition: none; }
  .replay { animation: none; }
}
</style>
</head>
<body>

<canvas id="garden" aria-hidden="true"></canvas>
<div class="veil" id="veil"></div>
<main class="paper" id="paper" aria-label="Mektup">
  <div class="letter" id="letter" role="textbox" aria-multiline="true" aria-label="Mektup metni" spellcheck="false" data-ph="Buraya yaz…"></div>
</main>
<button class="replay" id="replay" type="button" aria-label="Baştan oynat" hidden>
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
</button>

<script>
(function () {
'use strict';

/* ===== Kağıtta görünecek yazı: tırnaklar arasını kendi yazınla değiştir ===== */
const MESAJ = `Sevgilim,

insan bazen bir insanda hem evini,
hem huzununu bulur.
belki tartışırız, bazen anlaşamayız
ama yine en huzurlu hissettiğim yer 
senin yanın oluyor.
insan evini yağmurda da sever,
güneşte de.

seni seviyorum`;

/* ---------- yardımcılar ---------- */
const TAU = Math.PI * 2, rand = Math.random;
const rr = (a, b) => a + (b - a) * rand();
const rint = n => Math.floor(rand() * n);
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };

const cs = getComputedStyle(document.documentElement);
const V = n => cs.getPropertyValue(n).trim();
const STEM = V('--stem'), STEM_D = V('--stem-dark'), WRAP = V('--wrap'), WRAP_D = V('--wrap-dark'), RIBBON = V('--ribbon');

/* ---------- çiçek sprite'ları (bir kez çizilir) ---------- */
const SS = 384;
const PAL = {
  crimson:  { a: '#8e0f32', b: '#e0475f', c: '#5a0a1e' },
  pink:     { a: '#c2306b', b: '#ffa6c4', c: '#f2b134' },
  peach:    { a: '#e8794b', b: '#ffd9b8', c: '#b5502a' },
  lavender: { a: '#7f5fc4', b: '#e1d5f7', c: '#ffd24a' },
  white:    { a: '#e4d8e4', b: '#ffffff', c: '#ffcf3f' },
  yellow:   { a: '#f0a900', b: '#fff08a', c: '#b36b00' },
  magenta:  { a: '#b0125f', b: '#ff7fb8', c: '#ffd24a' },
  blush:    { a: '#f08fb0', b: '#fff0f5', c: '#f4b400' },
  red:      { a: '#c4161c', b: '#ff6a4d', c: '#1c1220' },
  orange:   { a: '#f26a1b', b: '#ffc04d', c: '#1c1220' },
  sky:      { a: '#5b86e0', b: '#d4e4ff', c: '#ffe27a' }
};
const DEFS = [['rose','crimson'],['rose','pink'],['rose','peach'],['rose','lavender'],['daisy','white'],['daisy','yellow'],['cosmos','magenta'],['cosmos','blush'],['cosmos','lavender'],['poppy','red'],['poppy','orange'],['blossom','pink'],['blossom','white'],['blossom','sky']];

function petal(g, len, wid, c0, c1) {
  g.beginPath(); g.moveTo(0, 0);
  g.bezierCurveTo(wid, -len * .22, wid * .95, -len * .9, 0, -len);
  g.bezierCurveTo(-wid * .95, -len * .9, -wid, -len * .22, 0, 0);
  const gr = g.createLinearGradient(0, 0, 0, -len);
  gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fill();
  g.lineWidth = 1.2; g.strokeStyle = 'rgba(60,0,30,.16)'; g.stroke();
}

function mkFlower(kind, p) {
  const cv = document.createElement('canvas'); cv.width = cv.height = SS;
  const g = cv.getContext('2d'); g.translate(SS / 2, SS / 2);
  const R = SS / 2 - 12;
  const ring = (n, len, wid, off, c0, c1, sh) => {
    for (let i = 0; i < n; i++) {
      g.save(); g.rotate(off + i * TAU / n);
      if (sh) { g.shadowColor = 'rgba(18,2,24,.5)'; g.shadowBlur = 9; g.shadowOffsetY = 3; }
      petal(g, len, wid, c0, c1); g.restore();
    }
  };
  const disc = (r, c0, c1) => {
    const gr = g.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r);
    gr.addColorStop(0, c0); gr.addColorStop(1, c1);
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fillStyle = gr; g.fill();
  };
  const dots = (n, r0, r1, dr, col) => {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const a = i * 2.39996, rad = lerp(r0, r1, Math.sqrt((i + .5) / n));
      g.beginPath(); g.arc(Math.cos(a) * rad, Math.sin(a) * rad, dr, 0, TAU); g.fill();
    }
  };
  if (kind === 'rose') {
    ring(7, R * .99, R * .42, 0, p.a, p.b, true);
    ring(6, R * .80, R * .36, .38, p.a, mix(p.a, p.b, .72));
    ring(5, R * .60, R * .30, .9, mix(p.a, '#000000', .12), mix(p.a, p.b, .5));
    ring(4, R * .40, R * .24, .2, mix(p.a, '#000000', .24), mix(p.a, p.b, .3));
    disc(R * .07, mix(p.a, '#000000', .3), mix(p.a, '#000000', .45));
    g.strokeStyle = 'rgba(40,0,20,.2)'; g.lineWidth = 1.6; g.lineCap = 'round';
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(0, 0, R * (.14 + i * .1), i * 2.1, i * 2.1 + 2.4); g.stroke(); }
  } else if (kind === 'daisy') {
    ring(16, R * .99, R * .12, 0, p.a, p.b, true);
    ring(16, R * .9, R * .12, TAU / 32, mix(p.a, p.b, .3), p.b);
    disc(R * .24, mix(p.c, '#ffffff', .45), p.c);
    dots(26, R * .02, R * .2, R * .014, 'rgba(60,20,0,.28)');
  } else if (kind === 'cosmos') {
    ring(8, R * .99, R * .3, 0, p.a, p.b, true);
    ring(8, R * .8, R * .27, TAU / 16, mix(p.a, p.b, .2), mix(p.a, p.b, .85));
    disc(R * .12, mix(p.c, '#ffffff', .4), p.c);
    dots(14, R * .03, R * .1, R * .012, 'rgba(90,40,0,.35)');
  } else if (kind === 'poppy') {
    ring(6, R * .99, R * .5, 0, p.a, p.b, true);
    ring(5, R * .74, R * .42, .55, mix(p.a, '#000000', .1), mix(p.a, p.b, .65));
    g.strokeStyle = '#2a1830'; g.fillStyle = '#2a1830'; g.lineWidth = 1.4;
    for (let i = 0; i < 26; i++) {
      const a = i * TAU / 26, c = Math.cos(a), s = Math.sin(a);
      g.beginPath(); g.moveTo(c * R * .14, s * R * .14); g.lineTo(c * R * .27, s * R * .27); g.stroke();
      g.beginPath(); g.arc(c * R * .28, s * R * .28, R * .017, 0, TAU); g.fill();
    }
    disc(R * .15, '#5a4a64', '#1c1220');
  } else {
    ring(5, R * .99, R * .42, 0, p.a, p.b, true);
    g.save(); g.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 5; i++) { g.save(); g.rotate(i * TAU / 5); g.beginPath(); g.arc(0, -R, R * .08, 0, TAU); g.fill(); g.restore(); }
    g.restore();
    g.strokeStyle = 'rgba(120,20,60,.22)'; g.lineWidth = 1.4;
    for (let i = 0; i < 5; i++) { g.save(); g.rotate(i * TAU / 5); g.beginPath(); g.moveTo(0, -R * .1); g.lineTo(0, -R * .7); g.stroke(); g.restore(); }
    g.strokeStyle = p.c; g.fillStyle = p.c; g.lineWidth = 1.4;
    for (let i = 0; i < 10; i++) {
      const a = i * TAU / 10 + .2, c = Math.cos(a), s = Math.sin(a);
      g.beginPath(); g.moveTo(0, 0); g.lineTo(c * R * .2, s * R * .2); g.stroke();
      g.beginPath(); g.arc(c * R * .21, s * R * .21, R * .02, 0, TAU); g.fill();
    }
    disc(R * .05, '#fff2b0', '#ffd24a');
  }
  return cv;
}

const LEAF = { w: 140, h: 340, bx: 70, by: 332, len: 318 };
function mkLeaf(c0, c1) {
  const cv = document.createElement('canvas'); cv.width = LEAF.w; cv.height = LEAF.h;
  const g = cv.getContext('2d'); g.translate(LEAF.bx, LEAF.by);
  const len = LEAF.len, wid = 64;
  g.shadowColor = 'rgba(10,0,16,.4)'; g.shadowBlur = 8; g.shadowOffsetY = 3;
  g.beginPath(); g.moveTo(0, 0);
  g.bezierCurveTo(wid, -len * .25, wid * .7, -len * .75, 0, -len);
  g.bezierCurveTo(-wid * .7, -len * .75, -wid, -len * .25, 0, 0);
  const gr = g.createLinearGradient(0, 0, 0, -len);
  gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fill();
  g.shadowColor = 'transparent';
  g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, -4); g.lineTo(0, -len * .92); g.stroke();
  g.lineWidth = 1.3; g.strokeStyle = 'rgba(255,255,255,.16)';
  for (let k = 1; k <= 6; k++) {
    const y = -len * (.1 + .125 * k), w = wid * .62 * (1 - k / 8);
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y - len * .07); g.moveTo(0, y); g.lineTo(-w, y - len * .07); g.stroke();
  }
  return cv;
}

const sprites = DEFS.map(d => mkFlower(d[0], PAL[d[1]]));
const leafSprites = [mkLeaf('#1c5b3a', '#58b377'), mkLeaf('#276b45', '#8fd18a')];

/* ---------- sahne durumu ---------- */
const cv = document.getElementById('garden'), ctx = cv.getContext('2d');
const paper = document.getElementById('paper'), letter = document.getElementById('letter');
const veil = document.getElementById('veil'), replay = document.getElementById('replay');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOT = still ? 0 : 1;

const N = 12, GAP = .34, TRAVEL = 1.5, T0 = .5;
const tLast = T0 + (N - 1) * GAP + TRAVEL;
const tWrap = tLast + .05, tBow = tLast + .5, tb = tLast + 1.6, tPaper = tb + 1.5;
const CORN = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
const DOTS = [[-.1, -.01], [.05, -.005], [.13, .03], [-.05, .045], [-.125, .055], [.04, .135], [-.045, .165], [0, .225]];

let W = 0, H = 0, DPR = 1, bW = 1, bH = 1;
let t = 0, last = 0, raf = 0, dirty = true, paperShown = false, run = 0, typer = 0, typing = false;
let flowers = [], bleaves = [], L0 = [], L1 = [], L2 = [];

/* buket içindeki çiçek yerleri (U birimi, g noktasına göre) */
const tp = [];
(function () {
  const RB = .27;
  for (let k = 0; k < N; k++) {
    const rad = RB * Math.sqrt((k + .45) / N), th = k * 2.399963;
    let x = rad * Math.cos(th) * 1.12, y = rad * Math.sin(th) * .84;
    if (y > 0) y *= .75;
    tp.push({ x: x, y: y - .21, r: lerp(.108, .078, rad / RB) });
  }
})();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.imageSmoothingQuality = 'high'; dirty = true;
}
const cellSize = () => clamp(Math.min(W, H) / 6.5, 70, 118);

function initFlowers() {
  const order = shuffle(sprites.map((_, i) => i));
  flowers = [];
  for (let i = 0; i < N; i++) {
    flowers.push({
      i: i, k: N - 1 - i, spr: order[i], corner: i % 4,
      rot: rr(0, TAU), spin: (rand() < .5 ? -1 : 1) * rr(.9, 1.8),
      bend: (i % 2 ? 1 : -1) * rr(.12, .22), sbend: rr(-.07, .07),
      ph: rr(0, TAU), ls: T0 + i * GAP
    });
  }
  bleaves = [];
  const LN = 9;
  for (let j = 0; j < LN; j++) {
    bleaves.push({
      ang: lerp(-1.3, 1.3, j / (LN - 1)) + rr(-.1, .1), len: rr(.34, .44), spr: j % 2,
      ta: T0 + Math.floor(j * N / LN) * GAP + TRAVEL, ph: rr(0, TAU)
    });
  }
}

function buildBurst(settled) {
  bW = W; bH = H;
  const c = cellSize();
  const cols = Math.ceil(W / c) + 1, rows = Math.ceil(H / c) + 1;
  L0 = []; L1 = []; L2 = [];
  const dl = (a, b) => settled ? -100 : rr(a, b);
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      L1.push({
        nx: ((i - .5 + rr(.1, .9)) * c) / W, ny: ((j - .5 + rr(.1, .9)) * c) / H,
        s: rr(.74, 1.04), spr: rint(sprites.length), rot: rr(0, TAU), spin: rr(-1.6, 1.6),
        ph: rr(0, TAU), bq: -1, delay: dl(0, .4), dur: rr(.95, 1.5)
      });
      if (rand() < .85) {
        L2.push({
          nx: ((i + .5 + rr(-.3, .3)) * c) / W, ny: ((j + .5 + rr(-.3, .3)) * c) / H,
          s: rr(.42, .6), spr: rint(sprites.length), rot: rr(0, TAU), spin: rr(-1.6, 1.6),
          ph: rr(0, TAU), bq: -1, delay: dl(.05, .5), dur: rr(.95, 1.5)
        });
      }
    }
  }
  const nl = Math.round(cols * rows * .6);
  for (let n = 0; n < nl; n++) {
    L0.push({
      leaf: true, nx: rr(-.03, 1.03), ny: rr(-.03, 1.03), s: rr(.9, 1.6), spr: n % 2,
      rot: rr(0, TAU), spin: rr(-1, 1), ph: rr(0, TAU), bq: -1, delay: dl(0, .35), dur: rr(.95, 1.5)
    });
  }
  const pick = shuffle(L1.map((_, i) => i)).slice(0, N);
  pick.forEach((idx, fi) => {
    const it = L1[idx];
    it.bq = fi; it.spr = flowers[fi].spr; it.s = rr(.85, 1.05);
    it.delay = dl(0, .15); it.dur = rr(1, 1.4);
  });
}

/* ---------- çizim parçaları ---------- */
function geom() {
  const U = Math.min(W * 1.1, H * .8);
  return { U: U, gx: W / 2, gy: H / 2 + U * .105 };
}

function drawFlower(si, x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.drawImage(sprites[si], -r, -r, 2 * r, 2 * r); ctx.restore();
}
function drawLeaf(x, y, ang, len, si) {
  const S = leafSprites[si], k = len / LEAF.len;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.drawImage(S, -LEAF.bx * k, -LEAF.by * k, LEAF.w * k, LEAF.h * k); ctx.restore();
}
function stem(hx, hy, ax, ay, bend, w) {
  const dx = hx - ax, dy = hy - ay, len = Math.hypot(dx, dy) || 1;
  const qx = (hx + ax) / 2 - dy / len * bend * len, qy = (hy + ay) / 2 + dx / len * bend * len;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(qx, qy, hx, hy);
  ctx.lineWidth = w + 2; ctx.strokeStyle = STEM_D; ctx.stroke();
  ctx.lineWidth = w; ctx.strokeStyle = STEM; ctx.stroke();
}

/* tek bir çiçeğin o andaki durumu */
function fstate(f, tt, geo) {
  const lt = tt - f.ls; if (lt <= 0) return null;
  const U = geo.U, gx = geo.gx, gy = geo.gy, T = tp[f.k];
  const tx = gx + T.x * U, ty = gy + T.y * U, tr = T.r * U;
  const cr = CORN[f.corner], ins = Math.min(70, Math.min(W, H) * .09);
  const sx = cr[0] < 0 ? ins : W - ins, sy = cr[1] < 0 ? ins : H - ins;
  const dx = tx - sx, dy = ty - sy, dist = Math.hypot(dx, dy) || 1, ux = dx / dist, uy = dy / dist;
  const b = clamp(lt / .55), m = clamp((lt - .4) / (TRAVEL - .4)), e = easeInOutCubic(m);
  const mx = (sx + tx) / 2 - uy * dist * f.bend, my = (sy + ty) / 2 + ux * dist * f.bend;
  const a = 1 - e;
  let x = a * a * sx + 2 * a * e * mx + e * e * tx, y = a * a * sy + 2 * a * e * my + e * e * ty;
  const sw = e * MOT;
  x += Math.sin(tt * 1.3 + f.ph) * .006 * U * sw; y += Math.cos(tt * 1.1 + f.ph) * .005 * U * sw;
  const r = tr * easeOutBack(b) * lerp(.55, 1, e);
  const rot = f.rot + f.spin * (1 - e) + Math.sin(tt * 1.2 + f.ph) * .05 * sw;
  const L = U * .3, k = e * e;
  return {
    x: x, y: y, r: r, rot: rot, sb: f.sbend,
    ax: lerp(x - ux * L, gx, k), ay: lerp(y - uy * L, gy, k)
  };
}

/* sarmalayıcı kâğıt: tepeden uca ölçeklenerek belirir */
function wrapBegin(geo, ws, ga) {
  const U = geo.U;
  ctx.save(); ctx.translate(geo.gx, geo.gy + U * .32);
  const s = lerp(.6, 1, ws); ctx.scale(s, s); ctx.translate(0, -U * .32);
  ctx.globalAlpha = ga * clamp(ws * 1.8);
}
function backPanel(geo, ws, ga) {
  if (ws <= 0) return;
  const U = geo.U, w = U * .215, y0 = -U * .07;
  wrapBegin(geo, ws, ga);
  ctx.beginPath(); ctx.moveTo(-w, y0 - U * .05);
  ctx.quadraticCurveTo(0, y0 - U * .14, w, y0 - U * .05);
  ctx.lineTo(0, U * .32); ctx.closePath();
  ctx.fillStyle = WRAP_D; ctx.fill(); ctx.restore();
}
function bow(U, bs) {
  const y = U * .09, hw = U * .126;
  ctx.lineCap = 'butt'; ctx.strokeStyle = RIBBON; ctx.lineWidth = U * .032;
  ctx.beginPath(); ctx.moveTo(-hw, y - U * .004); ctx.quadraticCurveTo(0, y + U * .03, hw, y - U * .004); ctx.stroke();
  ctx.save(); ctx.translate(0, y + U * .008);
  const s = easeOutBack(clamp(bs)); ctx.scale(s, s);
  ctx.fillStyle = mix(RIBBON, '#000000', .12);
  for (const sg of [-1, 1]) {
    ctx.save(); ctx.rotate(sg * .42); ctx.beginPath();
    ctx.moveTo(-U * .017, 0); ctx.lineTo(U * .017, 0); ctx.lineTo(U * .017, U * .15);
    ctx.lineTo(0, U * .12); ctx.lineTo(-U * .017, U * .15); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  for (const sg of [-1, 1]) {
    ctx.save(); ctx.scale(sg, 1); ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(U * .05, -U * .1, U * .17, -U * .08, U * .15, U * .005);
    ctx.bezierCurveTo(U * .13, U * .07, U * .05, U * .05, 0, 0); ctx.closePath();
    ctx.fillStyle = RIBBON; ctx.fill();
    ctx.beginPath(); ctx.moveTo(U * .025, -U * .005);
    ctx.bezierCurveTo(U * .06, -U * .055, U * .11, -U * .05, U * .11, 0);
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = U * .007; ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, U * .022, 0, TAU); ctx.fillStyle = mix(RIBBON, '#000000', .2); ctx.fill();
  ctx.restore();
}
function frontPanel(geo, ws, bs, ga) {
  if (ws <= 0) return;
  const U = geo.U, w = U * .215, y0 = -U * .07, ap = U * .32;
  wrapBegin(geo, ws, ga);
  ctx.beginPath(); ctx.moveTo(-w * .97, y0); ctx.quadraticCurveTo(0, y0 + U * .1, w * .97, y0);
  ctx.lineTo(0, ap); ctx.closePath();
  const gr = ctx.createLinearGradient(-w, 0, w, 0);
  gr.addColorStop(0, WRAP); gr.addColorStop(1, WRAP_D);
  ctx.fillStyle = gr; ctx.fill();
  ctx.beginPath(); ctx.moveTo(w * .97, y0); ctx.lineTo(0, ap); ctx.lineTo(U * .015, y0 + U * .098); ctx.closePath();
  ctx.fillStyle = 'rgba(150,50,80,.16)'; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (const d of DOTS) { ctx.beginPath(); ctx.arc(d[0] * U, d[1] * U, U * .009, 0, TAU); ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(-w * .97, y0); ctx.quadraticCurveTo(0, y0 + U * .1, w * .97, y0);
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = Math.max(1.5, U * .004); ctx.stroke();
  if (bs > 0) bow(U, bs);
  ctx.restore();
}

/* çiçeklerin altında kalan katmanlar: arka kâğıt, yapraklar, saplar */
function underLayer(tt, geo, sts, ga) {
  const U = geo.U, gx = geo.gx, gy = geo.gy;
  backPanel(geo, easeOutCubic(clamp((tt - tWrap) / .7)), ga);
  ctx.globalAlpha = ga;
  for (const lf of bleaves) {
    const p = clamp((tt - lf.ta) / .75); if (p <= 0) continue;
    drawLeaf(gx, gy, lf.ang + Math.sin(tt * 1.1 + lf.ph) * .03 * p * MOT, U * lf.len * easeOutBack(p), lf.spr);
  }
  const sw = Math.max(2, U * .011);
  for (const s of sts) { if (s) stem(s.x, s.y, s.ax, s.ay, s.sb, sw); }
  ctx.globalAlpha = 1;
}
function overLayer(tt, geo, ga) {
  frontPanel(geo, easeOutCubic(clamp((tt - tWrap) / .7)), clamp((tt - tBow) / .55), ga);
}

function bouquetScene(tt, geo) {
  const sts = flowers.map(f => fstate(f, tt, geo));
  underLayer(tt, geo, sts, 1);
  overLayer(tt, geo, 1);
  for (let i = 0; i < N; i++) { const s = sts[i]; if (s) drawFlower(flowers[i].spr, s.x, s.y, s.r, s.rot); }
}

function drawItem(it, tt, c, ox, oy, geo) {
  const p = clamp((tt - tb - it.delay) / it.dur);
  let sx = ox, sy = oy, sr = it.leaf ? 0 : c * it.s * .18, srot = it.rot;
  if (it.bq >= 0) {
    if (p < 1) { const st = fstate(flowers[it.bq], tb, geo); sx = st.x; sy = st.y; sr = st.r; srot = st.rot; }
  } else if (p <= 0) return;
  const e = easeOutBack(p, .7), es = easeOutBack(p, 1.3), er = easeOutCubic(p);
  const x = lerp(sx, it.nx * W, e), y = lerp(sy, it.ny * H, e);
  let r = lerp(sr, c * it.s, es);
  let rot = lerp(srot, it.rot, er) + it.spin * Math.sin(p * Math.PI);
  const w = clamp((tt - tb - it.delay - it.dur) / 1) * MOT;
  rot += Math.sin(tt * .9 + it.ph) * .08 * w; r *= 1 + Math.sin(tt * 1.3 + it.ph) * .03 * w;
  ctx.globalAlpha = it.bq >= 0 ? 1 : clamp(p * 6);
  if (it.leaf) drawLeaf(x, y, rot, r, it.spr); else drawFlower(it.spr, x, y, r, rot);
}

function burstScene(tt, geo) {
  const U = geo.U, gx = geo.gx, gy = geo.gy, ox = gx, oy = gy - U * .21;
  const fp = clamp((tt - tb) / 1.1);
  if (fp < 1) {
    const sts = flowers.map(f => fstate(f, tb, geo)), ga = 1 - fp * fp;
    ctx.save(); ctx.translate(gx, gy + H * .6 * fp * fp); ctx.rotate(fp * .45); ctx.translate(-gx, -gy);
    underLayer(tb, geo, sts, ga); overLayer(tb, geo, ga);
    ctx.restore();
  }
  const gp = clamp((tt - tb) / .9);
  if (gp < 1) {
    const R = Math.max(W, H) * .9 * easeOutCubic(gp) + 1;
    const gr = ctx.createRadialGradient(ox, oy, 0, ox, oy, R);
    gr.addColorStop(0, 'rgba(255,200,220,' + (.55 * (1 - gp)).toFixed(3) + ')');
    gr.addColorStop(.5, 'rgba(255,120,170,' + (.18 * (1 - gp)).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,120,170,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  const c = cellSize();
  for (const it of L0) drawItem(it, tt, c, ox, oy, geo);
  for (const it of L1) drawItem(it, tt, c, ox, oy, geo);
  for (const it of L2) drawItem(it, tt, c, ox, oy, geo);
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  const geo = geom();
  if (t < tb) bouquetScene(t, geo); else burstScene(t, geo);
}

/* ---------- kağıt ve yazı ---------- */
function enableEdit() {
  try { letter.contentEditable = 'plaintext-only'; } catch (e) { letter.contentEditable = 'true'; }
}
function doneTyping() {
  clearInterval(typer); typing = false;
  letter.classList.remove('typing'); letter.textContent = MESAJ; enableEdit();
}
function typeText(my) {
  if (my !== run) return;
  const chars = Array.from(MESAJ);
  if (!chars.length) { doneTyping(); return; }
  let i = 0; typing = true; letter.classList.add('typing');
  clearInterval(typer);
  typer = setInterval(function () {
    if (my !== run) { clearInterval(typer); return; }
    i++; letter.textContent = chars.slice(0, i).join(''); letter.scrollTop = letter.scrollHeight;
    if (i >= chars.length) doneTyping();
  }, 38);
}
function showPaper(instant) {
  paperShown = true; veil.classList.add('on'); replay.hidden = false;
  if (instant) paper.classList.add('instant');
  paper.classList.add('in');
  if (instant) { letter.textContent = MESAJ; enableEdit(); }
  else { const my = run; setTimeout(function () { typeText(my); }, 900); }
}
paper.addEventListener('pointerdown', function () { if (typing) doneTyping(); });
letter.addEventListener('paste', function (e) {
  e.preventDefault();
  const tx = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, tx);
});

/* ---------- akış ---------- */
function frame(now) {
  const dt = Math.min(.1, Math.max(0, (now - last) / 1000)); last = now;
  if (!still) t += dt;
  if (!still || dirty) { render(); dirty = false; }
  if (!paperShown && t >= tPaper) showPaper(still);
  raf = requestAnimationFrame(frame);
}
function start() {
  run++; cancelAnimationFrame(raf); clearInterval(typer); typing = false;
  paper.classList.remove('in', 'instant'); veil.classList.remove('on'); replay.hidden = true; paperShown = false;
  letter.classList.remove('typing'); letter.contentEditable = 'false'; letter.textContent = '';
  resize(); initFlowers(); buildBurst(still);
  t = still ? tPaper + 10 : 0; last = performance.now(); dirty = true;
  raf = requestAnimationFrame(frame);
}
addEventListener('resize', function () {
  resize();
  if (t > tb + 2.2 && (Math.abs(W - bW) / bW > .05 || Math.abs(H - bH) / bH > .2)) buildBurst(true);
});
replay.addEventListener('click', start);
start();
})();
</script>
